<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Codely is a lightning-fast collaborative code editor. Share code, brainstorm with AI, and collaborate in real-time instantly without logging in." />
  <title>Codely | Real-time Collaborative Code Editor</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  <script>
    (function() {
      try {
        var isRoom = window.location.pathname.length > 1 && window.location.pathname !== '/' && !window.location.pathname.startsWith('/docs');
        var homeSaved = localStorage.getItem('codely-home-theme');
        var theme = isRoom 
          ? (localStorage.getItem('codely-editor-theme') || 'vs-dark')
          : (homeSaved === 'light' ? 'vs' : 'vs-dark');
        document.documentElement.setAttribute('data-theme', theme);
        if (!isRoom) {
          document.documentElement.setAttribute('data-home-mode', homeSaved || 'dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
